<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>五子棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#1a1a2e);font-family:'Segoe UI',Arial,sans-serif;user-select:none;overflow:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.4) 100%);pointer-events:none}
#home,#game{text-align:center;position:relative;z-index:1}
#home h1{color:#dcb468;font-size:56px;margin-bottom:16px;letter-spacing:12px;text-shadow:0 0 40px rgba(220,180,104,.3);animation:fadeIn .8s}
#home .sub{color:#888;margin-bottom:36px;font-size:15px;letter-spacing:4px;animation:fadeIn 1s}
#home button{display:block;width:260px;margin:14px auto;padding:16px 0;font-size:20px;border:1px solid rgba(255,255,255,.08);border-radius:12px;cursor:pointer;color:#fff;transition:all .25s;backdrop-filter:blur(10px);position:relative;overflow:hidden;animation:slideUp .6s}
#home button:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.4)}
#home button:active{transform:scale(.97)}
#home .b1{background:rgba(107,155,107,.25);animation-delay:.1s}
#home .b2{background:rgba(107,107,155,.25);animation-delay:.2s}
#home .b3{background:rgba(155,107,107,.25);animation-delay:.3s}
#game{display:none;background:rgba(0,0,0,.2);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
canvas{border-radius:6px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 0 60px rgba(0,0,0,.1)}
#s{color:#ddd;margin:10px 0;font-size:18px;min-height:24px;transition:color .4s}
#s.win{color:#f0c040;font-size:22px;animation:bounce .5s}
#ctrls{margin-top:6px;display:flex;justify-content:center;align-items:center;gap:2px;flex-wrap:wrap}
#ctrls button,select{color:#fff;border:1px solid rgba(255,255,255,.1);padding:9px 18px;font-size:14px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.08);transition:all .2s}
#ctrls button:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
#back{background:rgba(255,255,255,.05)!important}#reset{background:rgba(107,155,107,.25)!important}#share{background:rgba(107,107,155,.25)!important}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:14px 32px;border-radius:12px;font-size:16px;opacity:0;transition:all .35s;pointer-events:none;z-index:100;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}
#toast.show{opacity:1;top:32px}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:200;backdrop-filter:blur(4px)}
#modal .box{background:linear-gradient(135deg,#333,#2a2a2a);padding:32px 40px;border-radius:16px;text-align:center;min-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);position:relative}
#modal .box p{color:#ddd;font-size:17px;margin-bottom:24px}
#modal .box button{padding:10px 32px;font-size:16px;border:none;border-radius:8px;cursor:pointer;margin:0 8px;color:#fff;transition:all .2s}
#modal .ok{background:#6b9b6b}#modal .ok:hover{background:#7aab7a}
#modal .close{background:#555;position:absolute;top:12px;right:16px;font-size:20px;background:none!important;color:#999;cursor:pointer}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style></head><body>
<div id="home">
  <h1>五 子 棋</h1>
  <div class="sub">GOMOKU</div>
  <button class="b1" onclick="startGame(1)">🎮 本地对战</button>
  <button class="b2" onclick="startGame(2)">🌐 线上对战</button>
  <button class="b3" onclick="startGame(0)">🤖 AI 对战</button>
</div>
<div id="game">
  <canvas id="c" width="540" height="540"></canvas>
  <div id="s"></div>
  <div id="ctrls">
    <button id="back" onclick="goHome()">← 返回</button>
    <span id="extra"></span>
    <button id="reset" onclick="doReset()">重新开始</button>
  </div>
</div>
<div id="toast"></div>
<div id="modal">
  <div class="box">
    <span class="close" onclick="closeModal(false)">✕</span>
    <p>切换难度会重新开始，确定要切换吗？</p>
    <button class="ok" onclick="closeModal(true)">确定</button>
    <button class="close" style="position:static;font-size:15px;padding:10px 32px;color:#ccc!important" onclick="closeModal(false)">取消</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script>
const N=15,S=36,D4=[[1,0],[0,1],[1,1],[1,-1]];
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const sEl=document.getElementById('s'),homeEl=document.getElementById('home'),gameEl=document.getElementById('game');
const extraEl=document.getElementById('extra'),toastEl=document.getElementById('toast'),modalEl=document.getElementById('modal');
let b,turn,over,mode,lastX,lastY,stoneAnim=0,lastAnim=0,particles=[];
let deadline=0,aborted=false,nodes=0;
let client=null,isHost=false,roomId='',myColor=1,onlineReady=false;
let diff=1,pendingDiff=0;

// ═══════════ Audio Engine ═══════════
let audioCtx=null,bgmGain=null,bgmOn=false;
function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();bgmGain=audioCtx.createGain();bgmGain.gain.value=.12;bgmGain.connect(audioCtx.destination);}}
function playClick(){
  if(!audioCtx)return;
  let t=audioCtx.currentTime,g=audioCtx.createGain(),o=audioCtx.createOscillator(),f=audioCtx.createBiquadFilter();
  g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);
  o.type='triangle';o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(200,t+.06);
  f.type='bandpass';f.frequency.value=1200;f.Q.value=.8;
  o.connect(f);f.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.08);
}
function startBGM(){
  if(bgmOn||!audioCtx)return;bgmOn=true;
  let notes=[262,294,330,392,440,523,587,660,784,880]; // pentatonic-ish C4-C6
  let seq=[0,2,4,7,9,7,4,2,0,2,4,7,5,2,7,4,0,4,7,9,7,4,2,0,-1,2,4,7,5,9,7,4]; // pattern with rests
  let pos=0,beat=.7;
  function playNote(){
    if(!bgmOn)return;
    let n=seq[pos%seq.length];
    if(n>=0){
      let t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=notes[n%notes.length];
      g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+beat*.85);
      o.connect(g);g.connect(bgmGain);o.start(t);o.stop(t+beat*.9);
    }
    pos++;setTimeout(playNote,beat*1000);
  }
  playNote();
}
function stopBGM(){bgmOn=false;}

// ═══════════ Particle system ═══════════
function spawnParticles(){
  for(let i=0;i<40;i++)particles.push({x:270,y:270,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-2,life:1,decay:.008+Math.random()*.02,size:2+Math.random()*4,color:['#f0c040','#e74c3c','#fff','#6bc'][i%4]});
  if(particles.length)requestAnimationFrame(animParticles);
}
let particleRAF=null;
function animParticles(){
  ctx.fillStyle='#dcb468';ctx.fillRect(0,0,540,540);
  ctx.strokeStyle='#8b7355';ctx.lineWidth=1;
  for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(S/2,i*S+S/2);ctx.lineTo(540-S/2,i*S+S/2);ctx.stroke();ctx.beginPath();ctx.moveTo(i*S+S/2,S/2);ctx.lineTo(i*S+S/2,540-S/2);ctx.stroke();}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x]){let cx=x*S+S/2,cy=y*S+S/2;ctx.beginPath();ctx.arc(cx,cy,S/2-2,0,Math.PI*2);ctx.fillStyle=b[y][x]==1?'#000':'#fff';ctx.fill();ctx.strokeStyle='#333';ctx.stroke();if(x===lastX&&y===lastY){ctx.beginPath();ctx.arc(cx,cy,S/2-1,0,Math.PI*2);ctx.strokeStyle='#e74c3c';ctx.lineWidth=2.5;ctx.stroke();ctx.lineWidth=1;}}
  let alive=false;
  for(let p of particles){if(p.life<=0)continue;alive=true;p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life-=p.decay;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color.replace(')','');ctx.globalAlpha=p.life;ctx.fill();}
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
  if(particles.length)particleRAF=requestAnimationFrame(animParticles);
}

// ═══════════ Stone pop-in animation ═══════════
function animStone(){
  if(stoneAnim>=1){stoneAnim=0;return;}
  stoneAnim=Math.min(1,stoneAnim+.12);
  let cx=lastX*S+S/2,cy=lastY*S+S/2,r=Math.max(1,S/2-2),sr=r*stoneAnim,alpha=.3+stoneAnim*.7;
  draw();
  // Overdraw the last stone with animation scale
  if(lastX>=0&&lastY>=0){
    let p=b[lastY][lastX];
    ctx.beginPath();ctx.arc(cx,cy,sr,0,Math.PI*2);
    ctx.fillStyle=p===1?'#000':'#fff';ctx.fill();ctx.strokeStyle='#333';ctx.stroke();
    // Highlight ring
    ctx.beginPath();ctx.arc(cx,cy,sr+1,0,Math.PI*2);
    ctx.strokeStyle='#e74c3c';ctx.lineWidth=2.5;ctx.globalAlpha=alpha;ctx.stroke();ctx.lineWidth=1;ctx.globalAlpha=1;
  }
  if(stoneAnim<1)requestAnimationFrame(animStone);else{stoneAnim=0;draw();}
}

// ═══════════ Pulse last move ═══════════
let pulseT=0,pulseRAF=null;
function startPulse(){pulseT=0;if(!pulseRAF)pulseRAF=requestAnimationFrame(animPulse);}
function animPulse(ts){
  pulseT+=.04;if(pulseT>Math.PI*2){pulseT=0;pulseRAF=null;draw();return;}
  draw();
  if(lastX>=0&&lastY>=0){
    let cx=lastX*S+S/2,cy=lastY*S+S/2,r=S/2-1+Math.sin(pulseT)*3;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle='#e74c3c';ctx.lineWidth=2+Math.abs(Math.sin(pulseT))*2;ctx.stroke();ctx.lineWidth=1;
  }
  pulseRAF=requestAnimationFrame(animPulse);
}

// ═══════════ Init ═══════════
function newBoard(){b=Array(N).fill().map(()=>Array(N).fill(0));turn=1;over=false;lastX=lastY=-1;stoneAnim=0;particles=[];if(particleRAF){cancelAnimationFrame(particleRAF);particleRAF=null;}if(pulseRAF){cancelAnimationFrame(pulseRAF);pulseRAF=null;}}

function startGame(m){
  initAudio();if(!bgmOn)startBGM();
  mode=m;homeEl.style.display='none';gameEl.style.display='block';
  newBoard();draw();
  document.getElementById('reset').style.display='inline-block';
  sEl.className='';
  if(mode===0)initAI();else if(mode===1)initLocal();else initOnline();
}

function initAI(){
  extraEl.innerHTML='<select id="diffsel" onchange="onDiffChange(+this.value)"><option value="0">🐣 简单</option><option value="1" selected>🤖 中等</option><option value="2">👹 困难</option><option value="3">💀 地狱</option></select>';
  document.getElementById('diffsel').value=diff;
  sEl.textContent='⚫ 你的回合';
}
function initLocal(){extraEl.innerHTML='';sEl.textContent='⚫ 黑棋回合';}

// ═══════════ AI difficulty ═══════════
function onDiffChange(v){if(hasMoves()){pendingDiff=v;modalEl.style.display='flex';}else{diff=v;}}
function closeModal(ok){modalEl.style.display='none';if(ok){diff=pendingDiff;newBoard();draw();sEl.textContent='⚫ 你的回合';}else{document.getElementById('diffsel').value=diff;}}
function hasMoves(){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x])return true;return false;}

// ═══════════ Click ═══════════
canvas.addEventListener('click',e=>{
  if(over)return;
  if(mode===0&&turn!==1)return;
  if(mode===2&&turn!==myColor)return;
  if(mode===2&&!onlineReady)return;
  const x=Math.round((e.offsetX-18)/S),y=Math.round((e.offsetY-18)/S);
  if(x<0||x>=N||y<0||y>=N||b[y][x])return;
  doMove(x,y);
  if(!over&&mode===0)aiMove();
  if(!over&&mode===2)sendMove(x,y);
});

function doMove(x,y){
  b[y][x]=turn;lastX=x;lastY=y;stoneAnim=.05;animStone();playClick();
  if(win(x,y,turn)){
    let w=(turn===1?'⚫':'⚪');
    if(mode===0)w+=turn===1?' 你获胜！':' AI 获胜！';
    else if(mode===2)w+=turn===myColor?' 你获胜！':' 对手获胜！';
    else w+=' 获胜！';
    sEl.textContent=w;sEl.className='win';over=true;spawnParticles();return;
  }
  turn=turn===1?2:1;
  if(mode===0)sEl.textContent=turn===1?'⚫ 你的回合':'⚪ AI 思考中...';
  else if(mode===1)sEl.textContent=(turn===1?'⚫ 黑棋':'⚪ 白棋')+' 回合';
  else sEl.textContent=(turn===myColor?'轮到你了':'等待对手...')+' ('+(turn===1?'⚫':'⚪')+')';
  startPulse();
}

// ═══════════ Board utils ═══════════
function get(x,y){return b[y]&&b[y][x]!=null?b[y][x]:-1}
function evalBoard(){let t=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x])t+=b[y][x]===2?lineScore(x,y,2):-lineScore(x,y,1);return t;}
function lineScore(x,y,p){
  let t=0;
  for(let[dx,dy]of D4){let c=0,o1=0,o2=0;for(let i=1;i<=5;i++){let v=get(x+dx*i,y+dy*i);if(v===p)c++;else{if(v===0)o1++;break}}for(let i=1;i<=5;i++){let v=get(x-dx*i,y-dy*i);if(v===p)c++;else{if(v===0)o2++;break}}let e=o1+o2;if(c>=5)t+=5e7;else if(c===4&&e>=1)t+=2e6;else if(c===4&&e===0)t+=5e4;else if(c===3&&e===2)t+=8e4;else if(c===3&&e===1)t+=8000;else if(c===2&&e===2)t+=3000;else if(c===2&&e===1)t+=500;else if(c===1&&e===2)t+=200;}
  return t;
}
function hasWin(p){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!b[y][x]){b[y][x]=p;let w=win(x,y,p);b[y][x]=0;if(w)return[x,y];}return null;}
function hasFour(p){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!b[y][x])for(let[dx,dy]of D4){let c=0,o1=0,o2=0;b[y][x]=p;for(let i=1;i<=5;i++){let v=get(x+dx*i,y+dy*i);if(v===p)c++;else{if(v===0)o1++;break}}for(let i=1;i<=5;i++){let v=get(x-dx*i,y-dy*i);if(v===p)c++;else{if(v===0)o2++;break}}b[y][x]=0;if(c>=4&&(o1+o2)>=1)return[x,y];}return null;}
function quickScore(x,y,p){let s=0;for(let[dx,dy]of D4){let c=0,e=0;for(let i=1;i<=4;i++){let v=get(x+dx*i,y+dy*i);if(v===p)c++;else{if(v===0)e++;break}}for(let i=1;i<=4;i++){let v=get(x-dx*i,y-dy*i);if(v===p)c++;else{if(v===0)e++;break}}if(c>=3&&e>=1)s+=5e4;else if(c===2&&e>=1)s+=2000;else if(c===1&&e>=1)s+=200;s+=c*10;}return s+(14-Math.abs(x-7)-Math.abs(y-7))*5;}
function getMoves(rng){let set=new Set(),m=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x])for(let dy=-rng;dy<=rng;dy++)for(let dx=-rng;dx<=rng;dx++){let ny=y+dy,nx=x+dx;if(nx>=0&&nx<N&&ny>=0&&ny<N&&!b[ny][nx])set.add(ny*N+nx);}if(!set.size){let c=7;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)set.add((c+dy)*N+(c+dx));}for(let k of set)m.push([k%N,Math.floor(k/N)]);return m;}

// ═══════════ Minimax ═══════════
function search(d,alpha,beta,mx){
  nodes++;if(nodes%512===0&&Date.now()>deadline){aborted=true;return evalBoard();}
  if(d<=0)return evalBoard();
  let p=mx?2:1,moves=getMoves(1),scored=moves.map(([x,y])=>({x,y,s:quickScore(x,y,p)+quickScore(x,y,mx?1:2)*0.9}));scored.sort((a,b)=>b.s-a.s);
  let bestV=mx?-Infinity:Infinity,any=false,limit=Math.min(scored.length,16);
  for(let i=0;i<limit;i++){let{x,y}=scored[i];b[y][x]=p;if(win(x,y,p)){b[y][x]=0;return mx?1e8+d*1e3:(-1e8-d*1e3);}b[y][x]=0;b[y][x]=p;let sc=search(d-1,alpha,beta,!mx);b[y][x]=0;any=true;if(mx){if(sc>bestV)bestV=sc;if(bestV>alpha)alpha=bestV;}else{if(sc<bestV)bestV=sc;if(bestV<beta)beta=bestV;}if(alpha>=beta)break;if(aborted){if(any)return bestV;break;}}
  if(!any)return evalBoard();return bestV;
}

// ═══════════ AI ═══════════
function aiMove(){
  setTimeout(()=>{if(mode!==0||over)return;
    let bx=7,by=7;
    let w=hasWin(2);if(w){doMove(w[0],w[1]);return;}
    w=hasWin(1);if(w){doMove(w[0],w[1]);return;}
    let f=hasFour(1);if(f){doMove(f[0],f[1]);return;}
    let moves=getMoves(2),scored=moves.map(([x,y])=>({x,y,s:lineScore(x,y,2)+lineScore(x,y,1)*0.9}));
    if(diff===0){scored.sort((a,b)=>b.s-a.s);let pool=scored.slice(0,Math.max(8,scored.length>>2));let pick=pool[Math.floor(Math.random()*pool.length)];bx=pick.x;by=pick.y;}
    else if(diff===1){let best=-Infinity;for(let{x,y,s:v}of scored)if(v>best){best=v;bx=x;by=y;}}
    else{let maxDepth=diff===2?8:16,topN=diff===2?45:35,timeLimit=diff===2?2000:5000,startDepth=diff===2?2:4;scored.sort((a,b)=>b.s-a.s);let cands=scored.slice(0,topN),best=-Infinity;deadline=Date.now()+timeLimit;aborted=false;nodes=0;
      for(let d=startDepth;d<=maxDepth&&!aborted;d+=2){let roundBest=-Infinity,rbx=bx,rby=by,n=d<=4?cands.length:Math.min(cands.length,20+Math.floor((maxDepth-d)*2));for(let i=0;i<n;i++){if(Date.now()>deadline){aborted=true;break;}let{x,y}=cands[i];b[y][x]=2;let sc=search(d-1,-Infinity,Infinity,false);b[y][x]=0;if(!aborted&&sc>roundBest){roundBest=sc;rbx=x;rby=y;}}if(!aborted){best=roundBest;bx=rbx;by=rby;}if(!aborted&&d<maxDepth)for(let i=0;i<Math.min(8,cands.length);i++){b[cands[i].y][cands[i].x]=2;cands[i].s=search(Math.min(2,d-1),-Infinity,Infinity,false);b[cands[i].y][cands[i].x]=0;}if(!aborted)cands.sort((a,b)=>b.s-a.s);}}
    if(!over)doMove(bx,by);
  },50);
}

// ═══════════ Online (MQTT) ═══════════
function initOnline(){
  let params=new URLSearchParams(window.location.search),rid=params.get('room');
  isHost=!rid;myColor=isHost?1:2;roomId=rid||Math.random().toString(36).substring(2,8).toUpperCase();
  extraEl.innerHTML='房间: <b>'+roomId+'</b>'+(isHost?' <button id="share" onclick="shareRoom()">📋 分享房间</button>':'');
  client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'gomoku_'+Math.random().toString(36).substring(2,10)});let topic='gomoku/'+roomId;
  client.on('connect',()=>{client.subscribe(topic);sEl.textContent=isHost?'等待对手加入... (你执 ⚫)':'已加入！等待 ⚫ 黑棋落子';turn=1;onlineReady=false;});
  client.on('message',(t,msg)=>{let d;try{d=JSON.parse(msg.toString());}catch(e){return;}if(d.s===myColor)return;if(d.t==='join'&&isHost){sEl.textContent='对手已加入！你执 ⚫ 黑棋先手';turn=1;onlineReady=true;client.publish(topic,JSON.stringify({t:'ack',s:myColor}));}if(d.t==='ack'&&!isHost){sEl.textContent='已连接！等待 ⚫ 黑棋落子';onlineReady=true;}if(d.t==='reset'){newBoard();draw();sEl.className='';sEl.textContent=isHost?'你执 ⚫ 黑棋先手':'等待 ⚫ 黑棋落子';turn=1;onlineReady=true;}if(d.t==='move'&&!over){let op=isHost?2:1;b[d.y][d.x]=op;lastX=d.x;lastY=d.y;turn=myColor;playClick();startPulse();draw();if(win(d.x,d.y,op)){sEl.textContent=(op===1?'⚫':'⚪')+' 对手获胜！';sEl.className='win';over=true;onlineReady=false;spawnParticles();return;}sEl.textContent='轮到你了 ('+(myColor===1?'⚫':'⚪')+')';}});
  client.on('error',()=>{sEl.textContent='连接失败，请重试';onlineReady=false;});
  if(!isHost)setTimeout(()=>{client.publish(topic,JSON.stringify({t:'join',s:myColor}));},800);
}
function shareRoom(){let base=location.href.split('?')[0];if(base.startsWith('file://'))base='https://darling02-syc.github.io/gomoku/';navigator.clipboard.writeText(base+'?room='+roomId).then(()=>{showToast('房间码已复制，分享给好友吧！');});}
function sendMove(x,y){if(client)client.publish('gomoku/'+roomId,JSON.stringify({t:'move',x,y,s:myColor}));}
function cleanupOnline(){if(client){client.end();client=null;}isHost=false;roomId='';onlineReady=false;}

// ═══════════ Toast ═══════════
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2000);}

// ═══════════ Navigation ═══════════
function goHome(){if(mode===2)cleanupOnline();stopBGM();homeEl.style.display='block';gameEl.style.display='none';extraEl.innerHTML='';}
function doReset(){newBoard();sEl.className='';if(mode===2){if(client)client.publish('gomoku/'+roomId,JSON.stringify({t:'reset',s:myColor}));if(isHost){sEl.textContent='已连接！你执 ⚫ 黑棋先手';turn=1;onlineReady=true;}else{sEl.textContent='已连接！等待 ⚫ 黑棋落子';turn=1;onlineReady=true;}}else if(mode===0){sEl.textContent='⚫ 你的回合';}else{sEl.textContent='⚫ 黑棋回合';}draw();}

// ═══════════ Draw ═══════════
function draw(){
  ctx.fillStyle='#dcb468';ctx.fillRect(0,0,540,540);
  ctx.strokeStyle='#8b7355';ctx.lineWidth=1;
  for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(S/2,i*S+S/2);ctx.lineTo(540-S/2,i*S+S/2);ctx.stroke();ctx.beginPath();ctx.moveTo(i*S+S/2,S/2);ctx.lineTo(i*S+S/2,540-S/2);ctx.stroke();}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x]){let cx=x*S+S/2,cy=y*S+S/2;ctx.beginPath();ctx.arc(cx,cy,S/2-2,0,Math.PI*2);ctx.fillStyle=b[y][x]==1?'#000':'#fff';ctx.fill();ctx.strokeStyle='#333';ctx.stroke();if(x===lastX&&y===lastY&&stoneAnim>=1){ctx.beginPath();ctx.arc(cx,cy,S/2-1,0,Math.PI*2);ctx.strokeStyle='#e74c3c';ctx.lineWidth=2.5;ctx.stroke();ctx.lineWidth=1;}}
}
function win(x,y,p){for(let[dx,dy]of D4){let c=1;for(let i=1;i<5;i++)if(b[y+dy*i]&&b[y+dy*i][x+dx*i]===p)c++;else break;for(let i=1;i<5;i++)if(b[y-dy*i]&&b[y-dy*i][x-dx*i]===p)c++;else break;if(c>=5)return true;}return false;}

newBoard();draw();
if(new URLSearchParams(window.location.search).get('room'))startGame(2);
</script></body></html>
