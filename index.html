<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>五子棋</title>
<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#2c2c2c;font-family:Arial}
#g{text-align:center}
canvas{border:2px solid #8b7355;border-radius:4px;cursor:pointer}
#s{color:#ccc;margin-top:12px;font-size:18px}
#r,#a,select{color:#fff;border:none;padding:8px 16px;font-size:16px;border-radius:4px;cursor:pointer;margin:8px 4px 0;background:#555}
#r{background:#6b9b6b}#r:hover{background:#5a8a5a}
#a{background:#6b6b9b}#a:hover{background:#5a5a8a}
</style></head><body>
<div id="g"><canvas id="c" width="540" height="540"></canvas>
<div id="s">⚫ 你的回合</div>
<button id="r">重新开始</button><button id="a">双人模式</button>
<select id="d"><option value="0">🐣 简单</option><option value="1" selected>🤖 中等</option><option value="2">👹 困难</option><option value="3">💀 地狱</option></select></div>
<script>
const N=15,S=36,c=document.getElementById('c'),ctx=c.getContext('2d'),sEl=document.getElementById('s'),ds=document.getElementById('d');
let b=Array(N).fill().map(()=>Array(N).fill(0)),turn=1,over=false,aiMode=true,deadline=0,aborted=false;
const D4=[[1,0],[0,1],[1,1],[1,-1]];

c.addEventListener('click',e=>{
  if(over)return;
  if(aiMode&&turn!=1)return;
  const x=Math.round((e.offsetX-18)/S),y=Math.round((e.offsetY-18)/S);
  if(x<0||x>=N||y<0||y>=N||b[y][x])return;
  place(x,y);if(!over&&aiMode)aiMove();
});

function place(x,y){
  b[y][x]=turn;draw();
  let w=win(x,y,turn);
  if(w){sEl.textContent=(turn==1?'⚫':'⚪')+(aiMode?(turn==1?' 你':' AI'):'')+' 获胜！';over=true;return}
  turn=turn==1?2:1;
  sEl.textContent=aiMode?(turn==1?'⚫ 你的回合':'⚪ AI 思考中...'):(turn==1?'⚫ 黑棋回合':'⚪ 白棋回合');
}

function get(x,y){return b[y]&&b[y][x]!=null?b[y][x]:-1}
function wouldWin(x,y,p){b[y][x]=p;let w=win(x,y,p);b[y][x]=0;return w;}

function lineScore(x,y,p){
  let t=0;
  for(let[dx,dy]of D4){
    let c=0,o1=0,o2=0;
    for(let i=1;i<=5;i++){let v=get(x+dx*i,y+dy*i);if(v===p)c++;else{if(v===0)o1++;break}}
    for(let i=1;i<=5;i++){let v=get(x-dx*i,y-dy*i);if(v===p)c++;else{if(v===0)o2++;break}}
    let e=o1+o2;
    if(c>=5)t+=5e7;
    else if(c===4&&e>=1)t+=2e6;
    else if(c===4&&e===0)t+=5e4;
    else if(c===3&&e===2)t+=8e4;
    else if(c===3&&e===1)t+=8000;
    else if(c===2&&e===2)t+=3000;
    else if(c===2&&e===1)t+=500;
    else if(c===1&&e===2)t+=200;
  }
  return t;
}

function evalBoard(){
  let t=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x])
    t+=b[y][x]===2?lineScore(x,y,2):-lineScore(x,y,1);
  return t;
}

// Simplified threat check (much faster, just what we need)
function hasWin(p){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!b[y][x]){b[y][x]=p;let w=win(x,y,p);b[y][x]=0;if(w)return[x,y];}
  return null;
}
function hasFour(p){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!b[y][x]){
    for(let[dx,dy]of D4){
      let c=0,o1=0,o2=0;
      b[y][x]=p;
      for(let i=1;i<=5;i++){let v=get(x+dx*i,y+dy*i);if(v===p)c++;else{if(v===0)o1++;break}}
      for(let i=1;i<=5;i++){let v=get(x-dx*i,y-dy*i);if(v===p)c++;else{if(v===0)o2++;break}}
      b[y][x]=0;
      if(c>=4&&(o1+o2)>=1)return[x,y];
    }
  }
  return null;
}

// Fast heuristic for move ordering
function quickScore(x,y,p){
  let s=0;
  for(let[dx,dy]of D4){
    let c=0,e=0;
    for(let i=1;i<=4;i++){let v=get(x+dx*i,y+dy*i);if(v===p)c++;else{if(v===0)e++;break}}
    for(let i=1;i<=4;i++){let v=get(x-dx*i,y-dy*i);if(v===p)c++;else{if(v===0)e++;break}}
    if(c>=3&&e>=1)s+=50000;
    else if(c===2&&e>=1)s+=2000;
    else if(c===1&&e>=1)s+=200;
    s+=c*10;
  }
  return s+(14-Math.abs(x-7)-Math.abs(y-7))*5;
}

function getMoves(rng){
  let set=new Set(),m=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x])
    for(let dy=-rng;dy<=rng;dy++)for(let dx=-rng;dx<=rng;dx++){
      let ny=y+dy,nx=x+dx;
      if(nx>=0&&nx<N&&ny>=0&&ny<N&&!b[ny][nx])set.add(ny*N+nx);
    }
  if(!set.size){let c=7;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)set.add((c+dy)*N+(c+dx));}
  for(let k of set)m.push([k%N,Math.floor(k/N)]);
  return m;
}

// Time-checked search
function search(d,alpha,beta,mx){
  if(Date.now()>deadline){aborted=true;return evalBoard();}
  if(d<=0)return evalBoard();

  let p=mx?2:1,moves=getMoves(1);
  // Sort moves by quick heuristic
  let scored=moves.map(([x,y])=>({x,y,s:quickScore(x,y,p)+quickScore(x,y,mx?1:2)*0.9}));
  scored.sort((a,b)=>b.s-a.s);

  let bestV=mx?-Infinity:Infinity,any=false;
  let limit=Math.min(scored.length,18);

  for(let i=0;i<limit;i++){
    let{x,y}=scored[i];
    // Check if this move wins immediately
    b[y][x]=p;
    if(win(x,y,p)){b[y][x]=0;return mx?1e8+d*1000:(-1e8-d*1000);}
    b[y][x]=0;

    b[y][x]=p;
    let sc=search(d-1,alpha,beta,!mx);
    b[y][x]=0;any=true;

    if(mx){if(sc>bestV)bestV=sc;if(bestV>alpha)alpha=bestV;}
    else{if(sc<bestV)bestV=sc;if(bestV<beta)beta=bestV;}
    if(alpha>=beta)break;
    if(aborted)break;
  }
  if(!any)return evalBoard();
  return bestV;
}

function aiMove(){
  setTimeout(()=>{
    let lv=+ds.value,moves=getMoves(2),bx=7,by=7;

    // Instant: win or block
    let w=hasWin(2);if(w){place(w[0],w[1]);return;}
    w=hasWin(1);if(w){place(w[0],w[1]);return;}
    let f=hasFour(1);if(f){place(f[0],f[1]);return;}

    // Score & sort
    let scored=moves.map(([x,y])=>({x,y,s:lineScore(x,y,2)+lineScore(x,y,1)*0.9}));
    scored.sort((a,b)=>b.s-a.s);

    if(lv<=1){
      let best=-Infinity;
      for(let{x,y,s:v}of scored){
        if(lv===0)v+=Math.random()*3000;
        if(v>best){best=v;bx=x;by=y;}
      }
    }else{
      let maxDepth=[0,0,8,20][lv];
      let topN=[0,0,50,30][lv];
      let timeLimit=[0,0,2000,4000][lv];
      let cands=scored.slice(0,topN);
      let best=-Infinity;

      for(let d=2;d<=maxDepth;d+=2){
        deadline=Date.now()+timeLimit;
        aborted=false;
        let roundBest=-Infinity,rbx=bx,rby=by;

        for(let{x,y}of cands){
          if(Date.now()>deadline){aborted=true;break;}
          b[y][x]=2;
          let sc=search(d-1,-Infinity,Infinity,false);
          b[y][x]=0;
          if(!aborted&&sc>roundBest){roundBest=sc;rbx=x;rby=y;}
        }

        if(!aborted){best=roundBest;bx=rbx;by=rby;}
        if(!aborted&&d<maxDepth){
          let results=cands.map(({x,y})=>{
            b[y][x]=2;let sc=search(Math.min(1,d-1),-Infinity,Infinity,false);b[y][x]=0;
            return{x,y,s:sc};
          });
          results.sort((a,b)=>b.s-a.s);
          cands=results.map(({x,y})=>({x,y}));
        }
        if(d>=maxDepth||aborted||best>9e7)break;
      }
    }
    if(!over)place(bx,by);
  },50);
}

function draw(){
  ctx.fillStyle='#dcb468';ctx.fillRect(0,0,540,540);
  ctx.strokeStyle='#8b7355';ctx.lineWidth=1;
  for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(S/2,i*S+S/2);ctx.lineTo(540-S/2,i*S+S/2);ctx.stroke();ctx.beginPath();ctx.moveTo(i*S+S/2,S/2);ctx.lineTo(i*S+S/2,540-S/2);ctx.stroke();}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x]){
    ctx.beginPath();ctx.arc(x*S+S/2,y*S+S/2,S/2-2,0,Math.PI*2);
    ctx.fillStyle=b[y][x]==1?'#000':'#fff';ctx.fill();ctx.strokeStyle='#333';ctx.stroke();
  }
}
function win(x,y,p){
  for(let[dx,dy]of D4){let c=1;for(let i=1;i<5;i++)if(b[y+dy*i]&&b[y+dy*i][x+dx*i]===p)c++;else break;for(let i=1;i<5;i++)if(b[y-dy*i]&&b[y-dy*i][x-dx*i]===p)c++;else break;if(c>=5)return true;}
  return false;
}

document.getElementById('r').addEventListener('click',()=>{b=Array(N).fill().map(()=>Array(N).fill(0));turn=1;over=false;sEl.textContent=aiMode?'⚫ 你的回合':'⚫ 黑棋回合';draw();});
const ab=document.getElementById('a');
ab.addEventListener('click',()=>{aiMode=!aiMode;ab.textContent=aiMode?'双人模式':'AI 对战';if(aiMode)sEl.textContent='⚫ 你的回合';else sEl.textContent='⚫ 黑棋回合';b=Array(N).fill().map(()=>Array(N).fill(0));turn=1;over=false;draw();});
draw();
</script></body></html>
